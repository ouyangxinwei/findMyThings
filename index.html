<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>Find My Things | 近くのお店を探す</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202820;background:#f5f7f4;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}main{width:min(760px,100% - 28px);margin:34px auto 60px}
    header{margin-bottom:22px}h1{font-size:clamp(1.7rem,5vw,2.3rem);margin:0 0 6px;letter-spacing:-.04em}
    header p,.muted{color:#68736a;margin:0;line-height:1.6}.panel{background:#fff;border:1px solid #e3e9e1;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #243b2410}
    h2{font-size:1rem;margin:0 0 14px}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}
    input,select,button{font:inherit;border-radius:10px;padding:11px 12px;border:1px solid #d5ddd3}
    input{width:100%;background:#fff}button{cursor:pointer;background:#244f36;color:white;border-color:#244f36;font-weight:650}
    button.secondary{background:#fff;color:#244f36}button:disabled{opacity:.55;cursor:wait}.row button{white-space:nowrap}
    .stack{display:grid;gap:12px}.location{font-size:.9rem;background:#f4f7f2;padding:12px;border-radius:10px;overflow-wrap:anywhere}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{width:100%}
    .filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.filters label{display:flex;align-items:center;gap:7px;font-size:.9rem}.filters select{padding:8px}
    #status{min-height:24px;font-size:.9rem;color:#58645a;margin-top:10px}.error{color:#b42318!important}
    .result{padding:14px 0;border-top:1px solid #edf0eb}.result:first-child{border-top:0}.result h3{font-size:1rem;margin:0 0 5px}
    .meta{font-size:.88rem;color:#657066;line-height:1.55}.distance{font-weight:750;color:#24563a;margin-left:7px;white-space:nowrap}
    .tag{display:inline-block;font-size:.72rem;background:#eaf3eb;color:#315d3e;padding:3px 7px;border-radius:20px;margin-left:5px}
    .empty{text-align:center;color:#68736a;padding:24px 8px}.foot{font-size:.78rem;color:#7a847b;line-height:1.6}
    .log-panel{background:#17211b;color:#d8e5da;border:1px solid #26392d;border-radius:12px;padding:14px;margin:14px 0;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
    .log-panel summary{cursor:pointer;font:600 .9rem system-ui,sans-serif;color:#e4eee5}
    #logOutput{margin:12px 0 0;max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
    .log-actions{display:flex;justify-content:flex-end;margin-top:8px}
    .log-actions button{font-size:.78rem;padding:6px 9px}
    @media(max-width:520px){main{margin-top:22px}.panel{padding:16px}.actions{grid-template-columns:1fr}.row{align-items:stretch}}
  </style>
</head>
<body>
<main>
  <header>
    <h1>Find My Things <span aria-hidden="true">📍</span></h1>
    <p>近くのコンビニ・スーパーを、距離の近い順に検索します。</p>
  </header>

  <section class="panel stack">
    <div>
      <h2>1. 検索する場所を指定</h2>
      <div class="actions">
        <button id="gpsBtn" type="button">現在地を取得する</button>
        <button id="demoBtn" class="secondary" type="button">デモ位置を使う（東京駅）</button>
      </div>
    </div>
    <div>
      <label for="postcode">郵便番号（7桁）</label>
      <div class="row"><input id="postcode" inputmode="numeric" maxlength="8" placeholder="例：100-0001"><button id="postcodeBtn" type="button">住所を取得</button></div>
    </div>
    <div>
      <label for="address">住所</label>
      <div class="row"><input id="address" placeholder="例：東京都千代田区丸の内1丁目"><button id="addressBtn" type="button">座標に変換</button></div>
    </div>
    <div class="location" id="selectedLocation">位置はまだ設定されていません。</div>
    <div class="filters">
      <label for="radius">検索半径</label>
      <select id="radius"><option value="500">500 m</option><option value="1000" selected>1 km</option><option value="2000">2 km</option><option value="5000">5 km</option></select>
      <span class="muted" id="coordinateText"></span>
    </div>
    <button id="searchBtn" type="button" disabled>周辺のお店を検索</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="panel">
    <h2>2. 検索結果 <span id="resultCount" class="muted"></span></h2>
    <div id="results" class="empty">場所を指定して「周辺のお店を検索」を押してください。</div>
  </section>
  <details class="log-panel" id="logPanel" open>
    <summary>実行ログ / Console</summary>
    <pre id="logOutput" aria-live="polite">ログはまだありません。</pre>
    <div class="log-actions"><button id="clearLogBtn" class="secondary" type="button">ログをクリア</button></div>
  </details>
  <p class="foot">店舗情報：OpenStreetMap contributors / 検索：Overpass API。データの登録状況により、実際の店舗が表示されない場合があります。距離は直線距離です。</p>
</main>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let center = null;
  const log = (message, level = "INFO") => {
    const output = $("logOutput");
    if (!output) return;
    if (output.textContent === "ログはまだありません。") output.textContent = "";
    const time = new Date().toLocaleTimeString("ja-JP", { hour12: false });
    output.textContent += (output.textContent ? "\n" : "") + "[" + time + "] [" + level + "] " + message;
    const lines = output.textContent.split("\n");
    if (lines.length > 100) output.textContent = lines.slice(-100).join("\n");
    output.scrollTop = output.scrollHeight;
  };
  $("clearLogBtn").addEventListener("click", () => { $("logOutput").textContent = "ログはまだありません。"; });
  const setStatus = (message, isError = false) => {
    $("status").textContent = message;
    $("status").classList.toggle("error", isError);
  };
  const setLocation = (lat, lon, label) => {
    if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      throw new Error("有効な緯度・経度を取得できませんでした。");
    }
    center = { lat, lon, label };
    log("位置を設定: " + label + " (" + lat.toFixed(5) + ", " + lon.toFixed(5) + ")");
    $("selectedLocation").textContent = label;
    $("coordinateText").textContent = lat.toFixed(5) + ", " + lon.toFixed(5);
    $("searchBtn").disabled = false;
    $("results").textContent = "検索を開始できます。";
    $("resultCount").textContent = "";
  };
  const withButton = async (button, task) => {
    button.disabled = true;
    try { await task(); } catch (error) {
      log((error.message || "処理に失敗しました。"), "ERROR");
      setStatus(error.message || "処理に失敗しました。", true);
    } finally { button.disabled = false; }
  };
  const jsonFetch = async (url, options = {}) => {
    const response = await fetch(url, { ...options, signal: AbortSignal.timeout(25000) });
    if (!response.ok) throw new Error("APIエラー（HTTP " + response.status + "）。時間をおいて再試行してください。");
    return response.json();
  };

  $("gpsBtn").addEventListener("click", () => withButton($("gpsBtn"), async () => {
    if (!navigator.geolocation) throw new Error("このブラウザは位置情報に対応していません。");
    setStatus("現在地を取得しています…");
    log("GPS位置情報の取得を開始");
    const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true, timeout: 15000, maximumAge: 60000
    }));
    setLocation(pos.coords.latitude, pos.coords.longitude, "現在地（GPS）");
    setStatus("現在地を設定しました。");
    log("GPS位置情報を取得しました", "SUCCESS");
  }));

  $("demoBtn").addEventListener("click", () => {
    setLocation(35.681236, 139.767125, "デモ位置：東京駅（固定座標）");
    setStatus("デモ位置を設定しました。実際の現在地ではありません。");
    log("東京駅のデモ位置を選択");
  });

  $("postcodeBtn").addEventListener("click", () => withButton($("postcodeBtn"), async () => {
    const zip = $("postcode").value.replace(/\D/g, "");
    if (!/^\d{7}$/.test(zip)) throw new Error("郵便番号は7桁で入力してください。");
    setStatus("郵便番号を検索しています…");
    log("郵便番号APIをリクエスト: " + zip);
    const data = await jsonFetch("https://postcode.teraren.com/postcodes/" + zip + ".json");
    log("郵便番号APIの応答を取得", "SUCCESS");
    const address = [data.prefecture, data.city, data.town || data.suburb].filter(Boolean).join("");
    if (!address) throw new Error("郵便番号に対応する住所が見つかりませんでした。");
    $("address").value = address;
    // Post-kun currently also returns coordinates for many postal codes.
    // Use them directly when available; fall back to GSI geocoding otherwise.
    const postalLat = Number(data.location?.latitude);
    const postalLon = Number(data.location?.longitude);
    if (data.location && Number.isFinite(postalLat) && Number.isFinite(postalLon)) {
      setLocation(postalLat, postalLon, "郵便番号：" + address);
      setStatus("郵便番号から住所と座標を取得しました。");
      log("郵便番号から住所・座標を取得完了", "SUCCESS");
    } else {
      setStatus("住所を取得しました。続けて座標に変換します。");
      await geocode(address);
    }
  }));

  async function geocode(address) {
    if (!address) throw new Error("住所を入力してください。");
    setStatus("住所を座標に変換しています…");
    log("国土地理院ジオコーダーをリクエスト: " + address);
    const url = "https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(address);
    const items = await jsonFetch(url);
    if (!Array.isArray(items) || !items.length) {
      throw new Error("住所が見つかりませんでした。もう少し詳しい住所を入力してください。");
    }
    // GSI results are not always returned in relevance order. Pick the title
    // with the longest common substring against the requested address.
    const commonLength = (a, b) => {
      let previous = new Array(b.length + 1).fill(0), best = 0;
      for (let i = 1; i <= a.length; i++) {
        const current = new Array(b.length + 1).fill(0);
        for (let j = 1; j <= b.length; j++) {
          if (a[i - 1] === b[j - 1]) {
            current[j] = previous[j - 1] + 1;
            best = Math.max(best, current[j]);
          }
        }
        previous = current;
      }
      return best;
    };
    const normalized = address.replace(/[\\s　]/g, "");
    const ranked = items.filter(item => item.geometry?.coordinates?.length === 2)
      .map(item => ({ item, score: commonLength(normalized, String(item.properties?.title || "").replace(/[\\s　]/g, "")) }))
      .sort((a, b) => b.score - a.score);
    if (!ranked.length || ranked[0].score < 2) {
      throw new Error("住所に一致する座標が見つかりませんでした。もう少し詳しい住所を入力してください。");
    }
    const selected = ranked[0].item;
    const [lon, lat] = selected.geometry.coordinates;
    setLocation(lat, lon, "住所：" + (selected.properties?.title || address));
    setStatus("住所から位置を設定しました。");
    log("住所から座標を取得完了", "SUCCESS");
  }
  $("addressBtn").addEventListener("click", () => withButton($("addressBtn"), () => geocode($("address").value.trim())));

  async function fetchOverpass(query) {
    // Public Overpass servers are shared and can be slow under load.
    // Try endpoints sequentially and give each enough time to respond.
    const endpoints = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter"
    ];
    let lastError = null;
    for (const endpoint of endpoints) {
      const startedAt = performance.now();
      try {
        log("店舗データAPIへ接続: " + endpoint + "（最大45秒待機）");
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body: new URLSearchParams({ data: query }),
          signal: AbortSignal.timeout(45000)
        });
        if (!response.ok) {
          let detail = "";
          try { detail = (await response.text()).slice(0, 180).replace(/\\s+/g, " "); } catch (_) {}
          throw new Error("HTTP " + response.status + (detail ? " / " + detail : ""));
        }
        const data = await response.json();
        if (!data || !Array.isArray(data.elements)) {
          throw new Error("APIから想定外のデータが返されました");
        }
        if (data.remark) {
          throw new Error("Overpass query error: " + String(data.remark).slice(0, 220));
        }
        const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);
        log("店舗データAPI応答成功: " + endpoint + " / " + data.elements.length + "件 / " + elapsed + "秒", "SUCCESS");
        return data;
      } catch (error) {
        lastError = error;
        const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);
        const reason = error.name === "TimeoutError" || error.name === "AbortError"
          ? "45秒でタイムアウト"
          : (error.message || error.name || "通信エラー");
        log("API失敗: " + endpoint + " / " + reason + " / " + elapsed + "秒", "ERROR");
      }
    }
    const reason = lastError?.name === "TimeoutError" || lastError?.name === "AbortError"
      ? "Overpass APIの2つの接続先がタイムアウトしました。時間をおいて再検索してください。"
      : (lastError?.message || "Overpass APIに接続できませんでした。");
    throw new Error(reason);
  }

  function distanceMeters(a, b) {
    const rad = (v) => v * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
    return Math.round(6371000 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)));
  }
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
  }
  function renderResults(places) {
    $("resultCount").textContent = "（" + places.length + "件）";
    if (!places.length) {
      $("results").className = "empty";
      $("results").textContent = "この範囲では店舗が見つかりませんでした。検索半径を広げてお試しください。";
      return;
    }
    $("results").className = "";
    $("results").innerHTML = places.map((p, i) => {
      const kind = p.kind === "supermarket" ? "スーパー" : "コンビニ";
      const address = p.address || "住所情報なし";
      const query = encodeURIComponent(p.name + " " + address);
      return '<article class="result"><h3>' + (i + 1) + ". " + escapeHtml(p.name) +
        '<span class="distance">' + p.distance + ' m</span><span class="tag">' + kind + '</span></h3>' +
        '<div class="meta">' + escapeHtml(address) + '</div>' +
        '<div class="meta"><a target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/search?query=' + query + '">OpenStreetMapで見る</a></div></article>';
    }).join("");
  }

  $("searchBtn").addEventListener("click", () => withButton($("searchBtn"), async () => {
    if (!center) throw new Error("先に検索する場所を指定してください。");
    const radius = Number($("radius").value);
    const { lat, lon } = center;
    const query = '[out:json][timeout:40];nwr["shop"~"^(convenience|supermarket)$"](around:' + radius + ',' + lat + ',' + lon + ');out center tags;';
    log("店舗検索を開始。半径=" + radius + "m、中心=" + lat + "," + lon);
    setStatus("OpenStreetMapのデータを検索しています…");
    $("results").className = "empty";
    $("results").textContent = "検索中…";
    let data;
    try {
      data = await fetchOverpass(query);
    } catch (error) {
      $("results").className = "empty";
      $("results").textContent = "店舗データを取得できませんでした。時間をおいて、もう一度検索してください。（" + (error.message || "通信エラー") + "）";
      $("resultCount").textContent = "";
      log("店舗検索を中止: " + (error.message || "通信エラー"), "ERROR");
      setStatus("検索に失敗しました。ログを確認してください。", true);
      return;
    }
    const unique = new Map();
    for (const item of (data.elements || [])) {
      const tags = item.tags || {};
      const point = item.type === "node" ? item : item.center;
      if (!point || !Number.isFinite(point.lat) || !Number.isFinite(point.lon)) continue;
      const kind = tags.shop === "supermarket" ? "supermarket" : "convenience";
      const name = tags.name || (kind === "supermarket" ? "名称未登録のスーパー" : "名称未登録のコンビニ");
      const key = item.type + "/" + item.id;
      const address = [tags["addr:province"], tags["addr:city"], tags["addr:suburb"], tags["addr:street"], tags["addr:housenumber"]].filter(Boolean).join("");
      unique.set(key, { name, kind, address, lat: point.lat, lon: point.lon, distance: distanceMeters(center, point) });
    }
    const places = [...unique.values()].filter(p => p.distance <= radius).sort((a, b) => a.distance - b.distance);
    renderResults(places);
    log("検索完了: " + places.length + "件取得（半径 " + radius + "m）", "SUCCESS");
    setStatus("検索が完了しました。店舗データはOpenStreetMapの登録内容に基づきます。");
  }));
})();
</script>
</body>
</html>
